<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AirScan · 隔空文件传输</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◉</span>
      <span class="name">AirScan</span>
      <span class="tag">隔空文件传输</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-mode="send">发送端 · 电脑</button>
      <button class="tab" data-mode="recv">接收端 · 手机</button>
    </nav>
  </header>

  <!-- ============ 发送端 ============ -->
  <main id="view-send" class="view active">
    <section class="panel">
      <h2>1. 选择文件</h2>
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" hidden />
        <div class="dz-inner">
          <div class="dz-icon">⬆</div>
          <div class="dz-title">点击或拖拽文件到这里</div>
          <div class="dz-sub" id="fileMeta">未选择文件</div>
        </div>
      </label>
    </section>

    <section class="panel">
      <h2>2. 传输参数</h2>
      <div class="actions" style="margin-bottom:12px">
        <button class="btn turbo" id="turboBtn">⚡ Turbo（最快）</button>
        <button class="btn balance" id="balanceBtn">⚖ 平衡（推荐）</button>
        <button class="btn" id="safeBtn">安全（最稳）</button>
      </div>
      <div class="grid">
        <label class="field">
          <span>编码模式</span>
          <select id="modeSel">
            <option value="bw" selected>黑白模式（QR，稳定）</option>
            <option value="color">多色模式（RGB 三通道，3× 速度）</option>
          </select>
        </label>
        <label class="field">
          <span>每帧数据字节</span>
          <input type="number" id="chunkSize" value="450" min="20" max="2900" step="50" />
        </label>
        <label class="field">
          <span>纠错级别</span>
          <select id="eccSel">
            <option value="L">L (7%)</option>
            <option value="M">M (15%)</option>
            <option value="Q" selected>Q (25%)</option>
            <option value="H">H (30%)</option>
          </select>
        </label>
        <label class="field">
          <span>每帧停留(ms)</span>
          <input type="number" id="frameMs" value="180" min="50" max="1000" step="10" />
        </label>
        <label class="field">
          <span>QR 放大倍数</span>
          <input type="number" id="scaleSel" value="8" min="2" max="16" step="1" />
        </label>
        <label class="field">
          <span>QR 版本上限</span>
          <input type="number" id="versionMax" value="20" min="6" max="40" step="1" />
        </label>
      </div>
      <div class="hint" id="capHint">
        平衡：BW + v20 + Q纠错 + 450B/帧。
      </div>
      <div class="hint" style="margin-top:6px;font-size:11px;color:#64748b">
        Turbo 最快（BW+v25+M · 960B/帧）· 平衡推荐（BW+v20+Q · 450B/帧）· 安全最稳（BW+v15+M · 200B/帧）
      </div>
    </section>

    <section class="panel">
      <h2>3. 开始广播</h2>
      <div class="actions">
        <button class="btn primary" id="startBtn">开始播放</button>
        <button class="btn primary" id="startDataBtn" disabled>开始传输数据</button>
        <button class="btn" id="pauseBtn" disabled>暂停</button>
        <button class="btn danger" id="stopBtn" disabled>停止</button>
      </div>
      <div class="stats" id="sendStats">就绪</div>
    </section>

    <section class="panel stage">
      <canvas id="qrCanvas"></canvas>
      <div class="stage-info" id="stageInfo">等待开始…</div>
    </section>
  </main>

  <!-- ============ 接收端 ============ -->
  <main id="view-recv" class="view">
    <section class="panel">
      <h2>摄像头扫描</h2>
      <div class="actions">
        <button class="btn primary" id="camBtn">开启摄像头</button>
        <select id="camSel" class="cam-sel"></select>
      </div>
      <div class="scan-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="scanCanvas"></canvas>
        <div class="scan-overlay" id="scanOverlay">
          <div class="reticle"></div>
          <div class="scan-status" id="scanStatus">未开启</div>
        </div>
      </div>
      <div class="actions">
        <label class="field inline">
          <input type="checkbox" id="colorModeRecv" />
          <span>多色模式（仅当发送端用多色时勾选）</span>
        </label>
        <button class="btn" id="resetBtn">清空已收</button>
        <label class="field inline">
          <input type="checkbox" id="debugView" />
          <span>显示调试画面</span>
        </label>
        <button class="btn" id="saveFrameBtn">保存当前帧</button>
      </div>
      <canvas id="debugCanvas" class="debug-canvas" hidden></canvas>
    </section>

    <section class="panel">
      <h2>传输进度</h2>
      <div class="progress">
        <div class="bar"><div class="fill" id="progFill"></div></div>
        <div class="prog-text" id="progText">0 / 0</div>
      </div>
      <div class="stats" id="recvStats">等待文件头…</div>
      <div class="file-card" id="fileCard" hidden>
        <div class="fc-row"><span>文件名</span><strong id="fileName"></strong></div>
        <div class="fc-row"><span>大小</span><strong id="fileSize"></strong></div>
        <div class="fc-row"><span>总块数</span><strong id="fileChunks"></strong></div>
        <div class="fc-row"><span>校验</span><strong id="fileCrc"></strong></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="downloadBtn" disabled>下载文件</button>
      </div>
    </section>
  </main>

  <footer class="foot">纯前端 · 无服务端 · 所有数据仅在本地设备之间通过屏幕-摄像头传输</footer>

  <script>
    // Tab 切换
    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        const mode = tab.dataset.mode;
        document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
        document.getElementById('view-' + mode).classList.add('active');
      });
    });
  </script>

  <!-- 依赖库（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="js/protocol.js"></script>
  <script src="js/sender.js"></script>
  <script src="js/receiver.js"></script>
</body>
</html>
